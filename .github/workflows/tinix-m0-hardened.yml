name: Tinix M0 Hardened Proxy Build & Mock Verification

on:
  workflow_dispatch:
  push:
    branches:
      - codex/tinix-m0-hardened-proxy

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-and-build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install NASM for aws-lc-sys / boring-sys
        shell: pwsh
        run: |
          choco install nasm cmake ninja -y --no-progress
          $nasmCandidates = @(
            "C:\Program Files\NASM",
            "C:\ProgramData\chocolatey\bin"
          ) | Where-Object { Test-Path $_ }
          foreach ($dir in $nasmCandidates) {
            echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Compile Rust tests and release binary with tinix-m0-hardened
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (-not (Test-Path dist/index.html)) {
            Set-Content -Path dist/index.html -Value "<!doctype html><title>Tinix M0 Hardened Proxy</title>"
          }
          $manifest = 'src-tauri/Cargo.toml'
          $buildMessages = cargo test --locked --release --manifest-path $manifest --lib --features tinix-m0-hardened --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testExecutables = @($buildMessages | ForEach-Object {
            try {
              $message = $_ | ConvertFrom-Json -ErrorAction Stop
              if ($message.reason -eq 'compiler-artifact' -and $message.profile.test -and $message.target.name -eq 'antigravity_tools_lib' -and $message.executable) {
                $message.executable
              }
            } catch {}
          })
          if ($testExecutables.Count -lt 1) { throw 'Expected Rust lib test executable' }
          $testExecutable = $testExecutables[-1]
          Set-Content -Path "src-tauri/target/release/test-executable-path.txt" -Value $testExecutable -NoNewline

          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $manifestTool = Get-ChildItem "$sdkBin/*/x64/mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $manifestTool) { throw 'Windows SDK manifest tool (mt.exe) not found' }
          & $manifestTool.FullName -nologo -manifest tests/windows_test_common_controls.xml "-outputresource:$testExecutable;#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --features tinix-m0-hardened --bin antigravity-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item -LiteralPath 'src-tauri/resources/WebView2Loader.dll' -Destination 'src-tauri/target/release/WebView2Loader.dll' -Force

      - name: Generate SHA-256 and M0 build manifest
        shell: pwsh
        run: |
          $bin = "src-tauri/target/release/antigravity-tools.exe"
          $loader = "src-tauri/target/release/WebView2Loader.dll"
          if (-not (Test-Path $bin)) {
            throw "Expected binary not found at $bin"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $bin).Hash.ToLowerInvariant()
          $loaderHash = (Get-FileHash -Algorithm SHA256 $loader).Hash.ToLowerInvariant()
          $commit = (git rev-parse HEAD).Trim()
          $builtAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          Set-Content -Path "src-tauri/target/release/source-commit.txt" -Value $commit -NoNewline
          Set-Content -Path "src-tauri/target/release/sha256.txt" -Value "$hash  antigravity-tools.exe`n$loaderHash  WebView2Loader.dll" -NoNewline

          $manifest = [ordered]@{
            schemaVersion = 1
            application = "tinix-media-creator"
            providerId = "antigravity-local"
            buildFeature = "tinix-m0-hardened"
            commitSha = $commit
            binaryName = "antigravity-tools.exe"
            binarySha256 = $hash
            webView2LoaderSha256 = $loaderHash
            builtAt = $builtAt
            retryPolicy = "zero-retries"
            retryZeroVerified = $true
            maxRetries = 0
            maxUpstreamAttemptsPerRequest = 1
            accountRotation = $false
            endpointFallback = $false
            http2MaxRetryCount = 0
            redirectPolicy = "none"
            promptModification = $false
            exactModelRequired = "gemini-3.1-flash-image"
            allowedImageSizes = @("2K", "4K")
            allowedAspectRatios = @("1:1")
            allowedImageCount = 1
            forbidsPort8045 = $true
            requiresIsolatedProfile = $true
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "src-tauri/target/release/antigravity-tools.exe.m0-manifest.json" -Encoding utf8
          Get-Content "src-tauri/target/release/sha256.txt"
          Get-Content "src-tauri/target/release/antigravity-tools.exe.m0-manifest.json"

      - name: Run Tinix M0 Rust unit tests & Subprocess Mock Verification (loopback-only firewall enforced)
        shell: pwsh
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: "127.0.0.1,localhost"
        run: |
          $testExecutable = (Get-Content "src-tauri/target/release/test-executable-path.txt" -Raw).Trim()
          $releaseBinary = (Resolve-Path "src-tauri/target/release/antigravity-tools.exe").Path

          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          New-NetFirewallRule -DisplayName 'TinixM0TestsLocalhostOnlyLib' `
            -Direction Outbound `
            -Action Block `
            -Program $testExecutable `
            -RemoteAddress '1.0.0.0-126.255.255.255','128.0.0.0-223.255.255.255','2000::/3' | Out-Null

          New-NetFirewallRule -DisplayName 'TinixM0TestsLocalhostOnlyBin' `
            -Direction Outbound `
            -Action Block `
            -Program $releaseBinary `
            -RemoteAddress '1.0.0.0-126.255.255.255','128.0.0.0-223.255.255.255','2000::/3' | Out-Null

          & $testExecutable proxy::image_attempt_budget::tests --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable proxy::upstream::client::native_image_live_test_mock_tests --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable proxy::token_manager::tests::model_quotas_keep_gemini_3_pro_and_3_1_flash_image_separate --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable proxy::handlers::openai::native_image_live_test_count_tests --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python tests/tinix_m0_mock_verification.py `
            --binary $releaseBinary `
            --report src-tauri/target/release/m0-mock-test-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove temporary firewall rules
        if: always()
        shell: pwsh
        run: |
          Remove-NetFirewallRule -DisplayName "TinixM0TestsLocalhostOnlyLib" -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName "TinixM0TestsLocalhostOnlyBin" -ErrorAction SilentlyContinue

      - name: Upload Tinix M0 hardened Windows artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinix-m0-hardened-windows-x64
          path: |
            src-tauri/target/release/antigravity-tools.exe
            src-tauri/target/release/WebView2Loader.dll
            src-tauri/target/release/antigravity-tools.exe.m0-manifest.json
            src-tauri/target/release/source-commit.txt
            src-tauri/target/release/sha256.txt
            src-tauri/target/release/m0-mock-test-report.json
          if-no-files-found: warn

