name: Native image live-test safety build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-safety-build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run persistent-budget tests with localhost mock upstreams
        shell: pwsh
        run: |
          $manifest = 'src-tauri/Cargo.toml'
          cargo test --locked --manifest-path $manifest --lib --features native-image-live-test proxy::image_attempt_budget::tests
          cargo test --locked --manifest-path $manifest --lib --features native-image-live-test proxy::upstream::client::native_image_live_test_mock_tests
          cargo test --locked --manifest-path $manifest --lib --features native-image-live-test proxy::handlers::openai::native_image_live_test_count_tests

      - name: Build the dedicated test binary
        shell: pwsh
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release --bin antigravity-tools --features native-image-live-test

      - name: Create source and binary checksums
        shell: pwsh
        run: |
          $binary = Resolve-Path 'src-tauri/target/release/antigravity-tools.exe'
          $output = Join-Path $env:RUNNER_TEMP 'native-image-live-test-artifact'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $output 'antigravity-tools.exe')
          $commit = (git rev-parse HEAD).Trim()
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $output 'antigravity-tools.exe')).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $output 'source-commit.txt') -Value $commit -NoNewline
          Set-Content -LiteralPath (Join-Path $output 'sha256.txt') -Value "$sha256  antigravity-tools.exe" -NoNewline
          Write-Output "Source commit: $commit"
          Write-Output "Binary SHA-256: $sha256"

      - name: Upload only the binary and provenance files
        uses: actions/upload-artifact@v7
        with:
          name: native-image-live-test-windows-2022
          path: ${{ runner.temp }}/native-image-live-test-artifact/
          if-no-files-found: error
          retention-days: 7
