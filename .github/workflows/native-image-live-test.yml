name: Native image live-test safety build

on:
  push:
    branches:
      - codex/native-4k-safe-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-safety-build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js for the embedded UI assets
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build the embedded UI assets
        shell: pwsh
        run: |
          npm install --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate public-network blocking for the mock test process
        shell: pwsh
        run: |
          $probeProgram = Join-Path $env:RUNNER_TEMP 'native-image-firewall-probe.exe'
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          $rule = New-NetFirewallRule -DisplayName 'Native image test firewall validation' -Direction Outbound -Action Block -Program $probeProgram -RemoteAddress '1.0.0.0-126.255.255.255','128.0.0.0-223.255.255.255','2000::/3'
          Remove-NetFirewallRule -Name $rule.Name

      - name: Download checksum-pinned NASM from the official distribution
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nasm-3.02-win64.zip'
          Invoke-WebRequest -Uri 'https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip' -OutFile $archive
          $expected = '161d0bfaff53c2f9e9f3e69fd0672323ebabafd1268976a5cec11be92a19aee7'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'NASM checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'native-image-build-tools'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $nasmDirectory = Join-Path $destination 'nasm-3.02'
          & (Join-Path $nasmDirectory 'nasm.exe') -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run persistent-budget tests with localhost mock upstreams
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_native_image_resolution_mock.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = 'src-tauri/Cargo.toml'
          $buildMessages = cargo test --locked --release --manifest-path $manifest --lib --features native-image-live-test --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testExecutables = @($buildMessages | ForEach-Object {
            $message = $_ | ConvertFrom-Json
            if ($message.reason -eq 'compiler-artifact' -and $message.profile.test -and $message.target.name -eq 'antigravity_tools_lib' -and $message.executable) { $message.executable }
          })
          if ($testExecutables.Count -ne 1) { throw 'Expected one Rust lib test executable' }
          $testExecutable = $testExecutables[0]
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $manifestTool = Get-ChildItem "$sdkBin/*/x64/mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $manifestTool) { throw 'Windows SDK manifest tool not found' }
          # Tauri embeds the normal application manifest only into app binaries.
          # Apply Common Controls v6 to this test executable only (tauri#13419).
          & $manifestTool.FullName -nologo -manifest tests/windows_test_common_controls.xml "-outputresource:$testExecutable;#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The application's User-Agent resolver can check Google's update service.
          # Block public unicast traffic from the test executable (including children)
          # so even ancillary code can never reach a real Google service in CI.
          New-NetFirewallRule -DisplayName 'Native image tests: localhost only' -Direction Outbound -Action Block -Program $testExecutable -RemoteAddress '1.0.0.0-126.255.255.255','128.0.0.0-223.255.255.255','2000::/3' | Out-Null
          & $testExecutable proxy::image_attempt_budget::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testExecutable proxy::upstream::client::native_image_live_test_mock_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testExecutable proxy::handlers::openai::native_image_live_test_count_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the dedicated test binary
        shell: pwsh
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --release --bin antigravity-tools --features native-image-live-test

      - name: Create source and binary checksums
        shell: pwsh
        run: |
          $binary = Resolve-Path 'src-tauri/target/release/antigravity-tools.exe'
          $output = Join-Path $env:RUNNER_TEMP 'native-image-live-test-artifact'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          Copy-Item -LiteralPath $binary -Destination (Join-Path $output 'antigravity-tools.exe')
          Copy-Item -LiteralPath 'src-tauri/resources/WebView2Loader.dll' -Destination (Join-Path $output 'WebView2Loader.dll')
          $commit = (git rev-parse HEAD).Trim()
          $binarySha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $output 'antigravity-tools.exe')).Hash.ToLowerInvariant()
          $loaderSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $output 'WebView2Loader.dll')).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $output 'source-commit.txt') -Value $commit -NoNewline
          Set-Content -LiteralPath (Join-Path $output 'sha256.txt') -Value "$binarySha256  antigravity-tools.exe`n$loaderSha256  WebView2Loader.dll" -NoNewline
          Write-Output "Source commit: $commit"
          Write-Output "Binary SHA-256: $binarySha256"
          Write-Output "WebView2Loader SHA-256: $loaderSha256"

      - name: Upload only the binary and provenance files
        uses: actions/upload-artifact@v7
        with:
          name: native-image-live-test-windows-2022
          path: ${{ runner.temp }}/native-image-live-test-artifact/
          if-no-files-found: error
          retention-days: 7
